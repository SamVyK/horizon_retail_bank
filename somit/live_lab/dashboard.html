<style>
/* Layout: a presenter console. Chapter rail on the left, one chapter on stage at a time, live KPI strip on top. */
:root{
  --bg:#0E1420; --panel:#151D2C; --panel-2:#1B2638; --line:#26344B;
  --fg:#E7ECF4; --muted:#93A0B5; --faint:#5E6C84;
  --accent:#4FD1C5; --accent-ink:#0B2B29;
  --warn:#F2B84B; --bad:#F2706A; --good:#5DD39E; --info:#7AA7FF;
  --core:#7AA7FF; --card:#F2B84B; --digital:#4FD1C5;
  --display:'Archivo','Arial Narrow',Arial,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F4F8; --panel:#FFFFFF; --panel-2:#EAEEF5; --line:#D3DAE6;
  --fg:#121A28; --muted:#4E5B70; --faint:#7D8AA0;
  --accent:#0E8F86; --accent-ink:#FFFFFF;
  --warn:#B07405; --bad:#C8352E; --good:#1E8A57; --info:#2F5FC4;
  --core:#2F5FC4; --card:#B07405; --digital:#0E8F86; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F4F8; --panel:#FFFFFF; --panel-2:#EAEEF5; --line:#D3DAE6;
  --fg:#121A28; --muted:#4E5B70; --faint:#7D8AA0;
  --accent:#0E8F86; --accent-ink:#FFFFFF;
  --warn:#B07405; --bad:#C8352E; --good:#1E8A57; --info:#2F5FC4;
  --core:#2F5FC4; --card:#B07405; --digital:#0E8F86; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 20px/1 var(--display);font-stretch:80%;letter-spacing:.5px;text-transform:uppercase}
.brand span{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.kpis{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;display:flex;gap:8px;align-items:baseline}
.kpi i{font-style:normal;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font:600 14px var(--mono)}
.ctrl{display:flex;gap:6px;align-items:center}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.timer{font:500 14px var(--mono);min-width:56px;text-align:center}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100% - 60px)}
.rail{border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow:auto}
.rail button{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px}
.rail button .k{font:600 12px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:5px;text-align:center;padding:2px 0}
.rail button .t{font-size:14px;line-height:1.25}
.rail button .t small{display:block;color:var(--muted);font-size:11.5px}
.rail button[aria-current="true"]{background:var(--panel);border-color:var(--line)}
.rail button[aria-current="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rail .foot{margin-top:auto;color:var(--faint);font-size:12px;padding:8px}
.progress{height:3px;background:var(--line)}
.progress div{height:100%;background:var(--accent);transition:width .3s}

.stage{padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.chap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font:500 12px var(--mono);color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:800 clamp(30px,4.2vw,52px)/1.02 var(--display);font-stretch:78%;text-transform:uppercase;letter-spacing:.3px}
h2{font:700 22px/1.2 var(--display);font-stretch:85%}
h3{font:600 15px/1.3 var(--body)}
p{margin:0;max-width:68ch}
.lede{font-size:17px;color:var(--muted);max-width:72ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel.flat{background:transparent}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:700 30px/1 var(--display);font-stretch:85%;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.tag{display:inline-block;width:fit-content;font:500 11px var(--mono);padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.tag.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.say{border-left:3px solid var(--accent);background:var(--panel);padding:12px 16px;border-radius:0 8px 8px 0;font-size:15px}
.say::before{content:"Say";display:block;font:500 11px var(--mono);color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
body.notes-off .say{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;padding:6px 12px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.hl td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
svg text{fill:var(--fg);font-family:var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* architecture */
.arch .node rect{fill:var(--panel-2);stroke:var(--line);stroke-width:1.2;transition:stroke .2s}
.arch .node{cursor:pointer}
.arch .node:hover rect,.arch .node.on rect{stroke:var(--accent);stroke-width:2}
.arch .node text.n1{font:600 13px var(--body)}
.arch .node text.n2{font:400 11px var(--mono);fill:var(--muted)}
.arch path.flow{fill:none;stroke:var(--line);stroke-width:1.6}
.arch path.flow.on{stroke:var(--accent)}
.arch circle.dot{fill:var(--accent)}
@media (prefers-reduced-motion:reduce){.arch circle.dot{display:none}}

/* id merge */
.ids{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.idc{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel-2);transition:transform .5s,opacity .5s}
.idc small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.idc b{font:500 14px var(--mono)}
.merged .idc{opacity:.45}
.entity{border:1px dashed var(--accent);border-radius:8px;padding:12px;text-align:center;opacity:.35;transition:opacity .4s}
.merged .entity{opacity:1;border-style:solid}

/* medallion */
.med{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.med button{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.med button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.med .lv{font:800 18px var(--display);font-stretch:80%;text-transform:uppercase}

/* graph */
.net line{stroke:var(--faint);stroke-width:1.2}
.net circle.c{fill:var(--panel-2);stroke:var(--fg);stroke-width:1.2}
.net circle.c.fr{stroke:var(--bad);stroke-width:2}
.net rect.e{stroke-width:1.5}
.net text{font-size:11px}
.net text.lab{font-family:var(--mono);fill:var(--muted)}

/* fabric */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600}
.tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.lin{display:flex;flex-direction:column;gap:6px}
.hop{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;opacity:.25;transition:opacity .35s}
.hop.on{opacity:1}
.hop .h{font:500 12px var(--mono);color:var(--muted)}
.hop .b{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--panel-2);font:500 13px var(--mono);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hop .b em{font-style:normal;color:var(--accent)}
.mask td.v{font-family:var(--mono)}
.role{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.res{font:600 12px var(--mono);min-width:120px;text-align:center;padding:4px 8px;border-radius:5px;border:1px solid var(--line);color:var(--faint)}
.res.ok{color:var(--good);border-color:var(--good)}
.res.no{color:var(--bad);border-color:var(--bad)}
.bar{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar div{height:100%}

/* live */
.pipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pipe .st{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px;font-size:12.5px;transition:border-color .15s,box-shadow .15s}
.pipe .st b{display:block;font:600 13px var(--body)}
.pipe .st span{color:var(--muted);font:400 11px var(--mono)}
.pipe .st.ping{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.pipe .ar{color:var(--faint)}
.feed{font:12.5px/1.5 var(--mono);height:300px;overflow:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .t{color:var(--faint)}
.feed .s-core{color:var(--core)} .feed .s-card{color:var(--card)} .feed .s-digital{color:var(--digital)}
.alerts{display:flex;flex-direction:column;gap:8px;height:300px;overflow:auto}
.alert{border:1px solid color-mix(in srgb,var(--bad) 50%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--panel));border-radius:8px;padding:8px 10px;font-size:13px;animation:pop .35s ease-out}
.alert b{color:var(--bad)}
.alert small{display:block;color:var(--muted);font-family:var(--mono);font-size:11.5px}
@keyframes pop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.alert{animation:none}}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rule{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel-2);display:flex;flex-direction:column;gap:4px}
.rule b{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.rule.fired{border-color:var(--bad)}
.rule small{color:var(--muted);font-size:12px}
.empty{color:var(--faint);font-size:13px;padding:10px}

.livepill.on{border-color:var(--good)} .livepill.on i{color:var(--good)} .livepill.on i::before{content:"● ";}
.livepill.off b{color:var(--faint)}
.toasts{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 76px);right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;cursor:pointer;background:var(--panel);border:1px solid var(--bad);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .3s ease-out;transition:opacity .5s,transform .5s}
.toast b{color:var(--bad)} .toast span{font-size:12.5px} .toast small{color:var(--muted);font-size:11.5px}
.toast.out{opacity:0;transform:translateX(20px)}
@media (prefers-reduced-motion:reduce){.toast{animation:none;transition:none}}
.navbtm{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .rail button{grid-template-columns:24px auto;flex:0 0 auto}
  .rail button .t small,.rail .foot{display:none}
  .g3,.g4,.rules{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.med{grid-template-columns:1fr}
  .kpis{margin-left:0}
}
@media (max-width:520px){
  .g3,.g4,.rules,.ids{grid-template-columns:1fr 1fr}
}
</style>
</head>

      LIVE.counts=d.counts; LIVE.total=d.total_alerts; LIVE.totalEvents=d.total_events;

     <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center" id="liveActs">
       <button class="btn primary" data-a="test1">Test 1 · overseas cluster</button>
       <button class="btn primary" data-a="test2">Test 2 · rapid burst</button>
       <button class="btn primary" data-a="test3">Test 3 · shared device</button>
       <button class="btn primary" data-a="test4">Test 4 · mule payee</button>
       <button class="btn" data-a="v1insert">V1 · insert 6 users</button>
       <button class="btn" data-a="v1update">V1 · update</button>
       <button class="btn" data-a="v1delete">V1 · delete</button>
       <button class="btn" data-a="clean">Clean slate</button>
       <span class="mono" id="actMsg" style="font-size:12.5px;color:var(--muted)"></span></div>
     <p style="font-size:12.5px;color:var(--muted)">Each button runs Somit’s own test SQL file. Inserting the same rows from CloudBeaver or Terminal shows up here in the same way.</p></div>`);
  w.append(pipe);
  pipe.querySelectorAll('#liveActs button').forEach(b=>b.onclick=async()=>{
    const msg=$('#actMsg',pipe); msg.textContent='running '+b.dataset.a+'…';
    try{ const r=await fetch(LIVE.base+'/api/run/'+b.dataset.a,{method:'POST'}); const d=await r.json();
      msg.textContent=d.ok?('✓ '+b.dataset.a+' ran'):('✗ '+(d.error||'failed').split('\n').pop());
      msg.style.color=d.ok?'var(--good)':'var(--bad)';
    }catch(e){ msg.textContent='✗ server not reachable'; msg.style.color='var(--bad)'; }
  });
  const rb=el(`<div class="rules">${RULES.map(r=>`<div class="rule" data-r="${r[0]}"><small>${r[1]}</small><b>0</b><small>${r[2]}</small></div>`).join('')}</div>`);
  w.append(rb);
  const fa=el(`<div class="grid g2"><div class="panel"><h2>Event stream · staging.live_event_log</h2><div class="feed" id="feed"></div></div>
     <div class="panel"><h2>Alerts · staging.fraud_events</h2><div class="alerts" id="alerts"></div></div></div>`);
  w.append(fa);
  const feed=$('#feed',fa), alerts=$('#alerts',fa);
  const paintAll=()=>{
    feed.innerHTML=''; if(!LIVE.events.length) feed.innerHTML='<div class="empty">Waiting for changes. Press a Test button, or insert a row from CloudBeaver.</div>';
    LIVE.events.slice(-120).forEach(e=>feed.append(evLine(e))); feed.scrollTop=feed.scrollHeight;
    alerts.innerHTML=''; if(!LIVE.alerts.length) alerts.innerHTML='<div class="empty">No alerts yet.</div>';
    LIVE.alerts.slice().reverse().forEach(a=>alerts.append(alertCard(a)));
    RULES.forEach(r=>{ const n=LIVE.counts[r[0]]||0; const c=rb.querySelector(`[data-r="${r[0]}"]`); c.querySelector('b').textContent=n; c.classList.toggle('fired',n>0); });
  };
  const ping=(n)=>{ const st=pipe.querySelectorAll('.st'); for(let i=0;i<n;i++) setTimeout(()=>{st[i].classList.add('ping'); setTimeout(()=>st[i].classList.remove('ping'),300);},i*110); };
  paintAll();
  LIVE.hook=(d,fresh)=>{
    if(!document.body.contains(feed)){ LIVE.hook=null; return; }
    if(fresh){ paintAll(); return; }
    if(d.events.length){ if(feed.querySelector('.empty')) feed.innerHTML=''; d.events.forEach(e=>feed.append(evLine(e))); feed.scrollTop=feed.scrollHeight; ping(d.alerts.length?6:3); }
    if(d.alerts.length){ if(alerts.querySelector('.empty')) alerts.innerHTML=''; d.alerts.forEach(a=>alerts.prepend(alertCard(a))); }
    if(!d.events.length && !d.alerts.length && !LIVE.events.length) paintAll();
    RULES.forEach(r=>{ const n=LIVE.counts[r[0]]||0; const c=rb.querySelector(`[data-r="${r[0]}"]`); c.querySelector('b').textContent=n; c.classList.toggle('fired',n>0); });
    if(!LIVE.events.length && feed.children.length && !feed.querySelector('.empty')) paintAll();
  };
}

function chLiveReplay(w){
  const pipe=el(`<div class="panel"><div class="pipe">
     <div class="st" data-st="0"><b>PostgreSQL</b><span>INSERT · WAL</span></div><span class="ar">→</span>
     <div class="st" data-st="1"><b>Debezium</b><span>logical replication</span></div><span class="ar">→</span>
     <div class="st" data-st="2"><b>Redpanda</b><span>Kafka topics</span></div><span class="ar">→</span>
     <div class="st" data-st="3"><b>fraud.py</b><span>4 rules</span></div><span class="ar">→</span>
     <div class="st" data-st="4"><b>fraud_events</b><span>alert rows</span></div><span class="ar">→</span>
     <div class="st" data-st="5"><b>Streamlit</b><span>:8501</span></div></div>
     <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn primary" id="liveBtn">Start replay</button><button class="btn" id="liveReset">Reset</button>
     <span class="mono" id="liveClock" style="font-size:13px;color:var(--muted)">replay clock 18:55:00</span>
     <span class="tag warn">Replay of example events. Start live_server.py to switch to live alerts from PostgreSQL.</span></div></div>`);
  w.append(pipe);
  const ruleDefs=[["overseas","Overseas cluster","3+ international card-not-present payments on one card in 60 min"],["burst","Rapid burst","5+ approved payments on one card in 10 min"],["device","Shared device","one device used by more than 2 users"],["benef","Suspicious beneficiary","one payee receiving from more than 5 senders"]];
  const rb=el(`<div class="rules">${ruleDefs.map(r=>`<div class="rule" data-r="${r[0]}"><small>${r[1]}</small><b>0</b><small>${r[2]}</small></div>`).join('')}</div>`);
  w.append(rb);
  const fa=el(`<div class="grid g2"><div class="panel"><h2>Event stream</h2><div class="feed" id="feed"><div class="empty">Press Start replay. Each line is one change captured from the database.</div></div></div>
     <div class="panel"><h2>Alerts · staging.fraud_events</h2><div class="alerts" id="alerts"><div class="empty">No alerts yet.</div></div></div></div>`);
  w.append(fa);
  const script=[];
  let t=0; const add=(dt,e)=>{t+=dt; script.push({t,...e});};
  const norm=(n)=>{for(let i=0;i<n;i++) add(40+Math.floor(Math.random()*40),[
     {s:'core',txt:`core_transactions INSERT · CORE_A00${1200+i} · transfer $${(50+Math.random()*900).toFixed(2)} · BEN_${['TELSTRA','ORIGIN','AGL','RENT_'+i][i%4]}`},
     {s:'card',txt:`card_transactions INSERT · CARD_00${2000+i} · ${['Coles','Woolworths','Uber Australia','JB Hi-Fi'][i%4]} · AUD ${(5+Math.random()*120).toFixed(2)} · APPROVED`},
     {s:'digital',txt:`digital_events INSERT · DIG_U00${3000+i} · Login · DEV_${4000+i} · 101.167.${i}.${20+i}`}][i%3]);};
  norm(4);
  for(let i=1;i<=3;i++) add(240,{s:'card',txt:`card_transactions INSERT · CARD_004211 · Hotel Excelsior Rome · EUR ${(180+i*35).toFixed(2)} · INTERNATIONAL · CNP`,rule:i===3?'overseas':null});
  norm(3);
  for(let i=1;i<=5;i++) add(70,{s:'card',txt:`card_transactions INSERT · CARD_001777 · GW_BURST_${i} · AUD ${(90+i*40).toFixed(2)} · APPROVED`,rule:i===5?'burst':null});
  norm(3);
  ['DIG_U000835','DIG_U000222','DIG_U000911'].forEach((u,i)=>add(110,{s:'digital',txt:`digital_events INSERT · ${u} · Login · DEV_MULE_RING_01 · 103.216.220.14`,rule:i===2?'device':null}));
  norm(3);
  for(let i=1;i<=6;i++) add(60,{s:'core',txt:`core_transactions INSERT · CORE_A0000${40+i} · transfer $${(4000+i*150).toFixed(2)} · BEN_MULE_AGGREGATOR_77`,rule:i===6?'benef':null});
  norm(4);
  const alertTxt={overseas:["Overseas cluster","CARD_004211 · 3 international card-not-present payments in 60 min"],burst:["Rapid burst","CARD_001777 · 5 approved payments in 10 min across GW_BURST_1–5"],device:["Shared device","DEV_MULE_RING_01 used by 3 digital users"],benef:["Suspicious beneficiary","BEN_MULE_AGGREGATOR_77 received from 6 senders"]};
  let idx=0, clock=18*3600+55*60, counts={overseas:0,burst:0,device:0,benef:0};
  const feed=$('#feed',w), alerts=$('#alerts',w);
  const hhmm=s=>{const h=Math.floor(s/3600)%24,m=Math.floor(s/60)%60,ss=s%60;return [h,m,ss].map(x=>String(x).padStart(2,'0')).join(':');};
  const ping=(n)=>{ const st=pipe.querySelectorAll('.st'); for(let i=0;i<n;i++) setTimeout(()=>{st[i].classList.add('ping'); setTimeout(()=>st[i].classList.remove('ping'),260);},i*90); };
  function step(){
    if(idx>=script.length){ stopLive(); $('#liveBtn',w).textContent='Replay finished'; return; }
    const e=script[idx++]; const ts=clock+e.t;
    $('#liveClock',w).textContent='replay clock '+hhmm(ts);
    if(feed.querySelector('.empty')) feed.innerHTML='';
    feed.append(el(`<div><span class="t">${hhmm(ts)}</span> <span class="s-${e.s}">${e.txt}</span></div>`)); feed.scrollTop=feed.scrollHeight;
    if(e.rule){ ping(6); counts[e.rule]++; const rr=rb.querySelector(`[data-r="${e.rule}"]`); rr.classList.add('fired'); rr.querySelector('b').textContent=counts[e.rule];
      if(alerts.querySelector('.empty')) alerts.innerHTML='';
      const [a,b]=alertTxt[e.rule]; alerts.prepend(el(`<div class="alert"><b>${a}</b> · ${b}<small>${hhmm(ts)} · replay</small></div>`)); }
    else ping(4);
  }
  $('#liveBtn',w).onclick=()=>{ if(liveTimer){stopLive(); $('#liveBtn',w).textContent='Resume replay';} else { if(idx>=script.length) return; liveTimer=setInterval(step,650); $('#liveBtn',w).textContent='Pause replay'; } };
  $('#liveReset',w).onclick=()=>{ stopLive(); idx=0; counts={overseas:0,burst:0,device:0,benef:0}; feed.innerHTML='<div class="empty">Press Start replay.</div>'; alerts.innerHTML='<div class="empty">No alerts yet.</div>'; rb.querySelectorAll('.rule').forEach(r=>{r.classList.remove('fired'); r.querySelector('b').textContent='0';}); $('#liveBtn',w).textContent='Start replay'; $('#liveClock',w).textContent='replay clock 18:55:00'; };
}
